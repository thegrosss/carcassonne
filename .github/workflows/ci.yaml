name: PR checks

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore Carcassonne.sln

      - name: Build
        run: dotnet build Carcassonne.sln -c Release --no-restore

      - name: Test
        run: dotnet test Carcassonne.sln -c Release --no-build